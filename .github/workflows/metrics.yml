name: Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Profile, language and streak cards
        run: python3 scripts/profile_svg.py
        env:
          ACCESS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          USER_NAME: mohmmedwee

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: mohmmedwee
          outputs: |
            assets/snake.svg
            assets/snake-dark.svg?palette=github-dark

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet && exit 0
          git commit -m "Update profile cards and snake [skip ci]"
          git push

  metrics:
    needs: profile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Contribution calendar
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics.calendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: mohmmedwee
          base: ""
          config_timezone: Asia/Amman
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Profile overview
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics.general.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: mohmmedwee
          base: header, activity, community
          config_timezone: Asia/Amman
          repositories_affiliations: owner
