name: Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Profile, language, streak and calendar cards
        run: python3 scripts/profile_svg.py
        env:
          # The built-in token reads public data; add a METRICS_TOKEN secret to include private contributions.
          ACCESS_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}
          USER_NAME: mohmmedwee

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: mohmmedwee
          outputs: |
            assets/snake.svg
            assets/snake-dark.svg?palette=github-dark

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet && exit 0
          git commit -m "Update profile cards and snake [skip ci]"
          git push
